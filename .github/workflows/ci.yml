name: CI & Ecosystem Validation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate-ecosystem:
    name: Validate Ecosystem Portal & Version 3.0.0 Contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Website & Link Structure
        run: |
          python -c "
          import os, sys, json
          print('Validating WebWeaveX v3.0.0 Ecosystem Portal...')
          
          # 1. Verify docs portal entry files
          required_files = [
              'README.md', 'SECURITY.md', 'CONTRIBUTING.md', 'LANGUAGES.md', 'ROADMAP.md',
              'docs/index.html', 'docs/styles.css', 'docs/app.js', 'docs/search-index.js',
              'docs/sitemap.xml', 'docs/robots.txt', 'docs/favicon.svg',
              'docs/ai-agents.md', 'docs/human-onboarding.md', 'docs/sdk-matrix.md',
              'docs/cookbook.md', 'docs/benchmarks.md', 'docs/faq.md'
          ]
          for path in required_files:
              assert os.path.exists(path), f'Missing required ecosystem file: {path}'
          
          # 2. Verify v3.0.0 in README.md
          with open('README.md', 'r', encoding='utf-8') as f:
              readme = f.read()
              assert 'v3.0.0' in readme or '3.0.0' in readme, 'README.md must reference v3.0.0'
          
          print('✅ Ecosystem Validation Passed Successfully!')
          "
