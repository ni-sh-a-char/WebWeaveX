name: Kotlin CI

on:
  push:
    branches: [kotlin]
  pull_request:
    branches: [kotlin]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build and test
        run: |
          cd kotlin
          ./gradlew clean test
      - name: Verify build
        run: |
          cd kotlin
          ./gradlew build
