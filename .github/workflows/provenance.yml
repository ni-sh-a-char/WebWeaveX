name: Provenance

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  attestations: write
  contents: read

jobs:
  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/index.js,dist/index.cjs"
