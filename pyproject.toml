[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "webweavex"
version = "2.0.0"
description = "Deterministic universal extraction and runtime cognition infrastructure"
readme = "README.md"
requires-python = ">=3.8"
authors = [{name = "Piyush Mishra"}]
license = {text = "Apache-2.0"}
keywords = [
    "extraction",
    "web-scraping",
    "semantic-analysis",
    "runtime-cognition",
    "deterministic",
    "browser-automation",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
    "requests>=2.28.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "markdownify>=0.12.0",
    "pypdf>=4.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "build>=1.0.0"]
browser = ["playwright>=1.40.0"]
native = []
ocr = ["pytesseract>=0.3.10", "Pillow>=10.0.0"]
distributed = []
connectors = []
parsers = ["tree-sitter-languages>=1.10.0"]
ingestion = ["python-docx>=1.0.0", "pytesseract>=0.3.10", "Pillow>=10.0.0"]
llm = ["groq>=0.9.0"]
full = [
    "playwright>=1.40.0",
    "tree-sitter-languages>=1.10.0",
    "python-docx>=1.0.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
    "groq>=0.9.0",
]

[project.urls]
Homepage = "https://github.com/PIYUSH-MISHRA-00/webweavex"
Repository = "https://github.com/PIYUSH-MISHRA-00/webweavex"
Documentation = "https://github.com/PIYUSH-MISHRA-00/webweavex#readme"
Issues = "https://github.com/PIYUSH-MISHRA-00/webweavex/issues"

[tool.setuptools.packages.find]
include = ["webweavex*", "core*", "extractors*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_tests.py"]
norecursedirs = ["archive", ".git", "build", "dist", "scripts"]
markers = [
    "integration: real-network integration tests",
]
