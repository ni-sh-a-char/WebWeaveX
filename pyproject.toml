[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "webweavex"
version = "2.0.0"
description = "Deterministic universal runtime extraction infrastructure with replay-safe graphs and Kaalka persistence"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Piyush Mishra"}]
license = {text = "Apache-2.0"}
keywords = [
    "extraction",
    "web-scraping",
    "semantic-analysis",
    "runtime-cognition",
    "deterministic",
    "browser-automation",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
    "Operating System :: OS Independent",
]

dependencies = [
    "requests>=2.28.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "markdownify>=0.12.0",
    "pypdf>=4.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pytest-cov>=4.1.0", "build>=1.0.0"]
browser = ["playwright>=1.40.0"]
native = []
ocr = ["pytesseract>=0.3.10", "Pillow>=10.0.0"]
distributed = []
connectors = []
parsers = ["tree-sitter-languages>=1.10.0"]
ingestion = ["python-docx>=1.0.0", "pytesseract>=0.3.10", "Pillow>=10.0.0"]
llm = ["groq>=0.9.0"]
full = [
    "playwright>=1.40.0",
    "tree-sitter-languages>=1.10.0",
    "python-docx>=1.0.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
    "groq>=0.9.0",
]

[project.urls]
Homepage = "https://github.com/PIYUSH-MISHRA-00/webweavex"
Repository = "https://github.com/PIYUSH-MISHRA-00/webweavex"
Documentation = "https://github.com/PIYUSH-MISHRA-00/webweavex#readme"
Issues = "https://github.com/PIYUSH-MISHRA-00/webweavex/issues"

[tool.setuptools.packages.find]
include = ["webweavex*", "core*", "extractors*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_tests.py"]
norecursedirs = ["archive", ".git", "build", "dist", "scripts"]
addopts = ["-p", "pytest_cov", "--cov", "--cov-report=term:skip-covered"]
markers = [
    "integration: real-network integration tests",
]

[tool.coverage.run]
source = [
    "webweavex",
    "core/kernel",
    "core/browser",
    "core/crypto",
    "core/contracts",
    "core/determinism",
    "core/replay",
    "core/memory",
    "core/execution",
    "core/synchronization",
    "core/reconstruction",
    "core/workflows",
    "core/connectors",
    "core/semantic",
    "core/runtime_graph",
    "core/ir",
    "core/typed_ir",
    "core/ingestion",
    "core/documents",
    "core/repository",
    "core/multimodal",
    "core/native",
    "core/distributed_extraction",
    "core/application",
    "core/adaptive",
    "core/auth",
    "core/causality",
    "core/evolution",
    "core/evolution_runtime",
    "core/graph",
    "core/extraction",
]
omit = [
    "*/build/*",
    "*/dist/*",
    "*/tests/*",
    "*/__pycache__/*",
    "webweavex/plugins/providers/*",
    "core/intent_engine.py",
    "core/source_orchestrator.py",
    "core/query_builder.py",
    "core/fetch_engine.py",
    "core/ranking_engine.py",
    "core/output_engine.py",
    "core/cache_engine.py",
    "core/full_pipeline.py",
    "core/documents/semantic_*",
    "core/documents/explanation_*",
    "core/documents/reconstruction/*",
    "core/repository/semantic/*",
    "core/repository/ast/*",
    "core/repository/kubernetes_semantic_engine.py",
    "core/repository/deployment_topology_engine.py",
    "core/repository/service_boundary_engine.py",
    "core/application/application_checkpoint_engine.py",
    "core/adaptive/infinite_scroll_recovery_engine.py",
    "core/memory/runtime_checkpoint_memory_engine.py",
    "core/memory/semantic_state_tracker.py",
    "core/graph/semantic_dependency_engine.py",
    "core/graph/graph_reconciliation_engine.py",
    "core/graph/graph_reconstruction_engine.py",
    "core/semantic/semantic_conflict_graph_engine.py",
    "core/native/native_window_engine.py",
    "core/documents/discourse_*",
    "core/repository/intelligence/*",
    "core/repository/topology_*",
    "core/repository/repository_reconstruction_engine.py",
    "core/graph/reasoning/*",
    "core/graph/semantic_causality_engine.py",
    "core/runtime_graph/cross_runtime_linking_engine.py",
    "core/connectors/live_runtime_memory_engine.py",
    "core/memory/runtime_query_engine.py",
    "core/semantic/semantic_divergence_engine.py",
    "core/semantic/semantic_conflict_engine.py",
    "core/native/platform/macos_ax_runtime.py",
    "core/native/platform/linux_atspi_runtime.py",
    "core/connectors/live_runtime_orchestrator.py",
    "core/documents/argument_structure_engine.py",
    "core/documents/rhetorical_dependency_engine.py",
    "core/documents/citation_grounding_engine.py",
    "core/application/application_session_graph_engine.py",
    "core/memory/semantic_merge_engine.py",
    "core/graph/dependency_reasoning_engine.py",
